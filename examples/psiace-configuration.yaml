  position: Agent Systems Engineer · Senior Engineer at OceanBase (Ant Group) · ASF Member

  tagline: Agent systems engineer at OceanBase focused on context products, database-native agent capabilities, and open source tools. Previously worked on Databend's core systems and led GraphRAG and GenAI platform engineering at NebulaGraph.

  jobs:
    - position: Senior Engineer
      company:
        name: OceanBase (Ant Group)
        link: https://www.oceanbase.com/
      description:
        - Build context products, database-native agent capabilities, and open source tools for OceanBase.
        - Integrate AI and agents into OceanBase open source. Improve developer tooling and upstream and downstream collaboration.
      from: "Dec. 2025"
      to: "present"
      tags:
        - Agent Engineering
        - Context Engineering
        - Databases
      location: Hangzhou, China

    - position: GenAI Platform Engineer
      company:
        name: Vesoft Inc.
        link: ""
      product:
        name: NebulaGraph
        link: https://www.nebula-graph.io/
        parenthesized: true
      description:
        - Led NebulaGraph GenAI platform engineering, including context construction and retrieval for domain Q&A.
        - Led Fusion GraphRAG design and delivery and integrated it into a deployable Q&A system.
      from: "Sep. 2024"
      to: "Dec. 2025"
      tags:
        - GraphRAG
        - Context Engineering
        - Graph Databases
      location: Shanghai, China

    - position: Core Engineer
      company:
        name: Databend Labs (cloud-native data warehouse)
        link: https://www.databend.com/
      product:
        name: Databend
        link: https://github.com/datafuselabs/databend
      description:
        - Founding team member who led major architecture changes and modularization. Also improved compile times and built the first continuous benchmark.
        - Integrated Databend with HuggingFace, lakeFS, and KubeSphere to support data lake and cloud-native use cases.
      from: "Jul. 2021"
      to: "Aug. 2024"
      tags:
        - Cloud-native Data Warehouse
        - Distributed Systems
        - Rust
      location: Remote

  objective: Build agent systems for production, where context and execution state are manageable and traceable. Develop these capabilities into maintainable products and open protocols.

  education:
    - place:
        name: Macau University of Science and Technology
        link: https://www.must.edu.mo/
