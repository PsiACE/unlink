    - name: "Bub 与 tape.systems"
      description: 设计与实现 Bub，一个面向共享环境与长期协作的 hook-first Agent runtime，已获得 1.6k+ GitHub Stars。提出以只追加记录组织 Agent 历史、状态与上下文的 tape 模型，该模型已用于 Bub 与 DeepChat。

    - name: "Fusion GraphRAG"
      description: 负责 Fusion GraphRAG 的设计与交付，选定业务场景问答精度约 95%；同等算力下，相比公开基线将首答可用时间缩短 80%。

