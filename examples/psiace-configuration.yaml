      description: 当选 Apache 软件基金会 Member ，多个 Apache 项目的 Committer 和贡献者，参与 OpenDAL 从孵化到毕业为 Apache 顶级项目的全过程，已在 LanceDB、Milvus 等项目中规模化使用。

