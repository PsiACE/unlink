  skills:
    - Agent Runtime / Context Engineering
    - Agent Protocols & Interoperability
    - RAG / GraphRAG & Evaluation
    - Distributed Systems / Data Infrastructure

  methodology:
    - Explicit State & Failure Recovery
    - Evaluation-driven Iteration
    - Developer Experience First
    - The Apache Way & Open Collaboration

  tools:
    - Rust / Python
    - LLM APIs / Tool Calling
    - ACP / MCP
    - Kubernetes / Docker
    - GitHub Actions

  achievements:
    - name: "Agent Client Protocol Python SDK"
      description: Created and maintain the ACP Python SDK, with typed schemas, async transports, and lifecycle abstractions for agents, editors, and clients. It has over 100 million downloads and is used by products including kimi-cli and mistral-vibe.

    - name: "Bub and tape.systems"
      description: Designed and implemented Bub, a hook-first agent runtime for shared environments and long-running work, with 1.6k+ GitHub stars. Proposed the append-only tape model for agent history, state, and context, now used by Bub and DeepChat.

    - name: "Fusion GraphRAG"
      description: Led Fusion GraphRAG design and delivery. It reached about 95% accuracy in selected scenarios and cut time to first usable answer by 80% against public baselines on the same compute.

    - name: "ASF Member and Apache OpenDAL"
      description: ASF Member and Committer or contributor to several Apache projects. Helped OpenDAL graduate from the Apache Incubator. LanceDB, Milvus, and other systems now use it.
